overwrite: true
schema: ./graphql.schema.json
documents: "src/**/*.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"
config:
  namingConvention:
    enumValues: keep
  avoidOptionals:
    field: true
  skipTypename: true
