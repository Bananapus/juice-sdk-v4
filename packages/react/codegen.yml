overwrite: true
schema: https://bendystraw.xyz/schema
documents: "src/**/*.graphql"
generates:
  src/generated/graphql.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typed-document-node"
  ./graphql.schema.json:
    plugins:
      - "introspection"
config:
  namingConvention:
    enumValues: keep
  avoidOptionals:
    field: true
  skipTypename: true
